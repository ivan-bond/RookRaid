name: CI

# Every push to main, every pull request, and on demand. Feature branches are covered by their pull request,
# so a push there does not run everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Jobs ask for more only where they need it.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a moved tag cannot change what runs here.
# Dependabot (github-actions) keeps the pins and the version comments up to date.
jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Gitleaks lists the files of a pull request. contents: read alone is not enough for that call.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block committed secrets and env files
        run: bash Tools/ci/check-secrets.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only token: no PR comments. No report upload either, it would contain the leaked value.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  rules:
    name: Game rules (iPhone, browser, server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Golden cases match the JavaScript rules
        run: node Tools/rules-js/check-golden.js
      - name: Server bundle plays the same games
        run: node Tools/rules-js/check-server.mjs
      - name: Generated files are up to date (server bundle, rules seed, golden cases)
        run: node Tools/ci/check-generated.mjs

  texts:
    name: Shared texts (iOS and web)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: All languages complete, placeholders match, every shown text translated
        run: node Tools/ci/check-i18n.mjs

  devices:
    name: iPhone layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Window size decides the layout
        run: bash Tools/ci/check-devices.sh

  web:
    name: Browser version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the lockfile
        working-directory: web
        run: npm ci
      - name: Type-check and build (with the offline service worker)
        working-directory: web
        run: npm run build
      - name: Legal pages exist, no secrets in the bundle
        run: node Tools/ci/check-web-build.mjs

  backend:
    name: Online database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rookraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rookraid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/tests/package-lock.json
      - name: Install the test client
        working-directory: Backend/tests
        run: npm ci
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Edge Functions type-check as deployed
        working-directory: Backend/supabase/functions
        run: deno check submit-action/index.ts finish-bot-match/index.ts delete-account/index.ts
      - name: Edge Functions reject forged moves and guests
        working-directory: Backend/supabase/functions
        run: deno test --allow-read --allow-net --allow-env functions_test.ts
      - name: Load every migration and play through the checks
        working-directory: Backend/tests
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/rookraid_test
        run: |
          node load-schema.js
          node privileges.js
          node scenario.js
          node flow.mjs

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # --ignore-scripts: only the audit runs here, no package install scripts.
      - name: Install test packages from the lockfile
        working-directory: Backend/tests
        run: npm ci --ignore-scripts
      - name: Known vulnerabilities in the test packages
        working-directory: Backend/tests
        run: npm audit --audit-level=high
      - name: Install browser packages from the lockfile
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Known vulnerabilities in the browser packages
        working-directory: web
        run: npm audit --audit-level=high
      - name: Known vulnerabilities in npm and Swift packages (osv.dev)
        run: node Tools/ci/osv-scan.mjs

  ios:
    name: iOS build
    # Xcode 27.1 ships the iOS 27.1 SDK. That SDK is what lets the app fill the
    # iPhone Duo inner display. It runs on Apple silicon only, so this job uses
    # the Xcode 27 runner. The app still launches on iOS 16.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with the iOS 27.1 SDK
        run: >
          xcodebuild
          -project RookRaid.xcodeproj
          -scheme RookRaid
          -configuration Debug
          -sdk iphonesimulator27.1
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
