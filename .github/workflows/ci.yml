name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Gitleaks lists the files of a pull request. contents: read alone is not enough for that call.
  pull-requests: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed secrets
        run: bash Tools/ci/check-secrets.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rules:
    name: Game rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Golden cases match the JavaScript rules
        run: node Tools/rules-js/check-golden.js

  devices:
    name: iPhone and iPad layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Window size decides the layout
        run: bash Tools/ci/check-devices.sh

  backend:
    name: Online database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rookraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rookraid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the test client
        working-directory: Backend/tests
        run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions reject forged moves and guests
        working-directory: Backend/supabase/functions
        run: deno test --allow-read --allow-net --allow-env functions_test.ts
      - name: Load every migration and play through the checks
        working-directory: Backend/tests
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/rookraid_test
        run: |
          node load-schema.js
          node privileges.js
          node scenario.js
          node flow.mjs

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test packages from the lockfile
        working-directory: Backend/tests
        run: npm ci
      - name: Known vulnerabilities in the test packages
        working-directory: Backend/tests
        run: npm audit --audit-level=high
      - name: Known vulnerabilities in npm and Swift packages
        run: node Tools/ci/osv-scan.mjs

  ios:
    name: iOS build
    # Xcode 27.1 ships the iOS 27.1 SDK. That SDK is what lets the app fill the
    # iPhone Duo inner display. It runs on Apple silicon only, so this job uses
    # the Xcode 27 runner. The app still launches on iOS 16.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build with the iOS 27.1 SDK
        run: >
          xcodebuild
          -project RookRaid.xcodeproj
          -scheme RookRaid
          -configuration Debug
          -sdk iphonesimulator27.1
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
